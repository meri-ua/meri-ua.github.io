<!doctype html>
<!-- Meri.ua — платформа українських вертикальних серіалів (MVP).
     Це КАРКАС. Програму з нього збирає tools/build.py → dist/index.html.
     Мітки (INCDIR, INC, BUILD між подвійними «@») описані на початку build.py.
     dist/index.html руками не правити: наступна збірка зітре зміни. -->
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef0f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Українські вертикальні серіали, які можна дивитися безкоштовно." />
  <title>Meri — українські вертикальні серіали</title>
  <style>
@@INCDIR:styles@@
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="large-title" id="pageTitle"></h1>
      <button class="coin-pill" data-go="coins" aria-label="Монети">
        <span id="coinIco"></span><span id="coinBalance">0</span>
      </button>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar"></nav>

    <section id="player" class="player hidden" aria-modal="true"></section>
    <div id="modal" class="modal hidden"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
window.MERI_BUILD = "@@BUILD@@";
@@INC:data/creators.js@@
@@INC:data/series.js@@
@@INCDIR:scripts/core@@
  </script>
</body>
</html>
