<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meri — варіанти дизайну</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --label: #1d1d1f; --label2: #6e6e73; --seg: rgba(120,120,128,.12); --segOn: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --label: #f5f5f7; --label2: #86868b; --seg: rgba(120,120,128,.24); --segOn: #636366; } }
    body { margin: 0; background: var(--bg); color: var(--label); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    header { text-align: center; padding: 48px 16px 24px; }
    h1 { font-size: 48px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
    header p { color: var(--label2); font-size: 21px; margin: 8px 0 24px; }
    .seg { display: inline-flex; background: var(--seg); border-radius: 10px; padding: 2px; gap: 2px; flex-wrap: wrap; justify-content: center; }
    .seg button { font: inherit; font-size: 14px; font-weight: 500; border: 0; background: none; color: var(--label); padding: 6px 16px; border-radius: 8px; cursor: pointer; }
    .seg button.on { background: var(--segOn); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .phones { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; padding: 16px 16px 64px; }
    figure { margin: 0; text-align: center; }
    .phone { width: 390px; height: 844px; border-radius: 54px; padding: 12px; background: #1d1d1f;
      box-shadow: 0 0 0 2px #3a3a3c, 0 40px 80px rgba(0,0,0,.25); position: relative; }
    .phone::before { content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 2; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 42px; background: #000; }
    figcaption { margin-top: 20px; }
    figcaption b { font-size: 22px; display: block; }
    figcaption span { color: var(--label2); font-size: 15px; }
    figcaption a { display: inline-block; margin-top: 10px; color: #0071e3; text-decoration: none; font-size: 15px; }
    @media (max-width: 600px) { .phone { width: 92vw; height: 180vw; } h1 { font-size: 34px; } }
  </style>
</head>
<body>
  <header>
    <h1>Три варіанти Meri.</h1>
    <p>Один застосунок — три характери в стилі Apple.</p>
    <div class="seg" id="seg">
      <button data-tab="foryou">Для тебе</button>
      <button data-tab="catalog" class="on">Каталог</button>
      <button data-tab="my">Медіатека</button>
      <button data-tab="coins">Монети</button>
      <button data-tab="profile">Профіль</button>
      <button data-open="babusia-ceo">Серіал</button>
    </div>
  </header>
  <div class="phones" id="phones"></div>

  <script>
    const V = [
      ["ios", "A · iOS Classic", "Системні кольори, згруповані списки, синій акцент"],
      ["music", "B · Cinema", "Темний кінорежим, великі обкладинки, рожевий акцент"],
      ["glass", "C · Liquid Glass", "Скло, плаваючий таб-бар, м'які градієнти"]
    ];
    const phones = document.getElementById("phones");
    phones.innerHTML = V.map(([id, name, hint]) => `
      <figure><div class="phone"><iframe data-v="${id}" title="${name}"></iframe></div>
        <figcaption><b>${name}</b><span>${hint}</span><br/><a href="index.html?v=${id}" target="_blank">Відкрити окремо ›</a></figcaption></figure>`).join("");
    function show(q) {
      document.querySelectorAll("iframe").forEach(f => f.src = `index.html?embed&v=${f.dataset.v}&${q}`);
    }
    document.getElementById("seg").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
      show(b.dataset.tab ? `tab=${b.dataset.tab}` : `tab=catalog&open=${b.dataset.open}`);
    });
    show("tab=catalog");
  </script>
</body>
</html>
