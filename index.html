<!doctype html>
<!-- Meri.ua — платформа українських вертикальних серіалів (MVP).
     Це КАРКАС. Програму з нього збирає tools/build.py → dist/index.html.
     Мітки (INCDIR, INC, BUILD між подвійними «@») описані на початку build.py.
     dist/index.html руками не правити: наступна збірка зітре зміни. -->
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef0f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Українські вертикальні серіали, які можна дивитися безкоштовно." />
  <title>Meri — українські вертикальні серіали</title>
  <style>
/* Meri.ua — стиль у дусі iOS / Apple Human Interface Guidelines */
:root {
  color-scheme: light dark;
  --bg: #f2f2f7;            /* systemGroupedBackground */
  --bg-elev: #ffffff;       /* secondarySystemGroupedBackground */
  --bg-elev2: #f2f2f7;
  --fill: rgba(120,120,128,.12);
  --fill2: rgba(120,120,128,.20);
  --label: #000000;
  --label2: rgba(60,60,67,.6);
  --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18);
  --tint: #007aff;          /* systemBlue */
  --coin: #ff9f0a;          /* systemOrange */
  --green: #34c759;
  --red: #ff3b30;
  --material: rgba(249,249,249,.78);
  --shadow: 0 8px 30px rgba(0,0,0,.12);
  --r: 16px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --bg-elev: #1c1c1e;
    --bg-elev2: #2c2c2e;
    --fill: rgba(120,120,128,.24);
    --fill2: rgba(120,120,128,.32);
    --label: #ffffff;
    --label2: rgba(235,235,245,.6);
    --label3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6);
    --tint: #0a84ff;
    --coin: #ffd60a;
    --green: #30d158;
    --red: #ff453a;
    --material: rgba(22,22,24,.78);
    --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--label); font-family: var(--font);
  -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
@media (min-width: 500px) { html, body { background: #d1d1d6; } }
@media (min-width: 500px) and (prefers-color-scheme: dark) { html, body { background: #111; } }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.coin { width: 1em; height: 1em; vertical-align: -0.12em; margin-right: .2em; flex: none; }
.hidden { display: none !important; }

#app { position: relative; max-width: 430px; height: 100dvh; margin: 0 auto; background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 500px) { #app { height: min(100dvh, 932px); margin-top: max(0px, calc((100dvh - 932px) / 2));
  border-radius: 44px; box-shadow: 0 30px 80px rgba(0,0,0,.35); } }

/* ---------- Навігаційна панель з великим заголовком ---------- */
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: 10px 20px 8px; padding-top: max(14px, var(--st, env(safe-area-inset-top))); z-index: 5; background: var(--bg); }
.large-title { font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1.15; margin: 0; }
.logo { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.logo span { color: var(--tint); }
.coin-pill { display: inline-flex; gap: 2px; align-items: center; background: var(--fill); padding: 6px 12px 6px 10px;
  border-radius: 999px; font-weight: 600; font-size: 15px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
/* На стрічці «Для тебе» — прозора панель поверх відео */
#app.feed .topbar { position: absolute; top: 0; left: 0; right: 0; background: transparent; color: #fff; }
#app.feed .coin-pill { background: rgba(255,255,255,.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
#app.feed .logo span { color: #fff; opacity: .7; }
#app.detail .topbar { display: none; }

#view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 16px 32px; }
#view.feed-mode { padding: 0; overflow: hidden; }

/* ---------- Таб-бар (матеріал з розмиттям) ---------- */
.tabbar { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); z-index: 10;
  background: var(--material); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-top: .5px solid var(--sep); padding-bottom: max(6px, var(--sb, env(safe-area-inset-bottom))); }
#app.feed .tabbar { background: rgba(10,10,12,.72); color: #fff; border-top-color: rgba(255,255,255,.12); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 2px;
  color: var(--label2); font-size: 10px; font-weight: 500; letter-spacing: .01em; }
#app.feed .tabbar button { color: rgba(255,255,255,.55); }
.tabbar button svg.i { width: 26px; height: 26px; }
.tabbar button.active, #app.feed .tabbar button.active { color: var(--tint); }
.tabbar button.active svg.i .fillable { fill: currentColor; }

/* ---------- Типографіка ---------- */
h2 { font-size: 22px; font-weight: 700; margin: 28px 0 10px; letter-spacing: .005em; }
h3 { font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--label2); margin: 26px 16px 7px; letter-spacing: .02em; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; }
.section-head a { color: var(--tint); font-size: 17px; cursor: pointer; }
.muted { color: var(--label2); }
.small { font-size: 13px; }
.footnote { font-size: 13px; color: var(--label2); margin: 7px 16px 0; line-height: 1.35; }

/* ---------- Кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; padding: 0 22px;
  border-radius: 14px; font-weight: 600; font-size: 17px; background: var(--tint); color: #fff; transition: opacity .15s, transform .15s; }
.btn:active { opacity: .7; transform: scale(.98); }
.btn.secondary { background: var(--fill); color: var(--tint); }
.btn.plain { background: none; color: var(--tint); min-height: 44px; }
.btn.blue { background: var(--tint); color: #fff; }
.btn.white { background: #fff; color: #000; }
.btn.glass { background: rgba(255,255,255,.2); color: #fff; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.btn.small-btn { min-height: 32px; padding: 0 14px; border-radius: 999px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }

/* ---------- Згруповані списки та картки ---------- */
.card { background: var(--bg-elev); border-radius: var(--r); padding: 16px; }
.group { background: var(--bg-elev); border-radius: var(--r); overflow: hidden; }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px;
  padding: 10px 16px; position: relative; font-size: 17px; }
.list-row + .list-row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.list-row .sub { font-size: 13px; color: var(--label2); margin-top: 2px; }
.list-row .chev { color: var(--label3); font-size: 20px; font-weight: 500; }
.list-row[data-play], .list-row[data-open] { cursor: pointer; }
.list-row[data-play]:active, .list-row[data-open]:active { background: var(--fill); }
.row-ico { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.row-ico svg.i { width: 18px; height: 18px; stroke-width: 2; }

/* Перемикач iOS */
.switch { width: 51px; height: 31px; border-radius: 999px; background: var(--fill2); position: relative; transition: background .25s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: left .25s cubic-bezier(.3,.7,.4,1); }
.switch.on { background: var(--green); }
.switch.on::after { left: 22px; }

/* Фільтри-капсули */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill);
  font-size: 15px; font-weight: 500; white-space: nowrap; }
.chip.active { background: var(--label); color: var(--bg-elev); }
.slide .chip, .hero .chip { background: rgba(255,255,255,.2); color: #fff; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); height: 28px; font-size: 13px; padding: 0 10px; }
.badge { font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 5px; background: #fff; color: #000; letter-spacing: .04em; }
.badge.ua { display: none; }

/* Пошук */
.search-wrap { position: relative; margin: 2px 0 12px; }
.search-wrap svg.i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--label2); }
.search { width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 11px; background: var(--fill); border: 0; outline: none; font-size: 17px; }
.search::placeholder { color: var(--label2); }

/* ---------- Постери ---------- */
.poster { position: relative; border-radius: 12px; aspect-ratio: 2/3; overflow: hidden; display: flex;
  align-items: center; justify-content: center; font-size: 46px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.poster::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.25), transparent 60%); }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.6)); }
.poster > * { z-index: 1; }
.poster .p-title { position: absolute; left: 10px; right: 10px; bottom: 9px; font-size: 14px; font-weight: 700;
  line-height: 1.15; color: #fff; letter-spacing: -.01em; }
.poster .p-top { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; }

.row { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 6px; margin: 0 -16px; scroll-snap-type: x mandatory;
  scroll-padding: 16px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row .item { flex: 0 0 38%; scroll-snap-align: start; }
.row.wide .item { flex-basis: 78%; }
.row.wide .poster { aspect-ratio: 16/10; font-size: 64px; }
.row.wide .poster .p-title { font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 10px; }
.item { cursor: pointer; transition: transform .15s; }
.item:active { transform: scale(.97); }
.item .name { font-size: 13px; font-weight: 500; margin-top: 7px; line-height: 1.2; }
.item .meta { font-size: 12px; color: var(--label2); margin-top: 2px; }

/* ---------- Стрічка «Для тебе» ---------- */
.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.slide { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column;
  justify-content: flex-end; padding: 20px 76px 22px 20px; overflow: hidden; color: #fff; }
.slide .bg-emoji { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 128px;
  filter: drop-shadow(0 20px 40px rgba(0,0,0,.35)); animation: float 6s ease-in-out infinite; }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, transparent 18%, transparent 40%, rgba(0,0,0,.82)); }
.slide > * { position: relative; z-index: 1; }
.slide h1 { font-size: 30px; font-weight: 800; margin: 8px 0 6px; letter-spacing: -.01em; line-height: 1.1; }
.slide .desc { font-size: 15px; line-height: 1.35; color: rgba(255,255,255,.85); margin-bottom: 16px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.slide .why { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
.slide .actions { display: flex; gap: 10px; }
.slide .side { position: absolute; right: 12px; bottom: 26px; display: flex; flex-direction: column; gap: 18px; z-index: 2; }
.side-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 500; gap: 4px; color: #fff; }
.side-btn b { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex;
  align-items: center; justify-content: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: transform .2s; }
.side-btn:active b { transform: scale(.88); }
.side-btn.on b { background: #fff; color: #ff2d55; }
.side-btn.on.save b { color: var(--tint); }
.side-btn.on svg.i { fill: currentColor; }
@keyframes float { 50% { transform: translateX(-50%) translateY(-14px); } }

/* ---------- Продовжити перегляд ---------- */
.cont { display: flex; gap: 12px; align-items: center; padding: 10px 16px; cursor: pointer; position: relative; }
.cont + .cont::before { content: ""; position: absolute; top: 0; left: 88px; right: 0; height: .5px; background: var(--sep); }
.cont:active { background: var(--fill); }
.cont .poster { width: 60px; flex: 0 0 60px; font-size: 24px; border-radius: 8px; box-shadow: none; }
.cont .info { flex: 1; min-width: 0; }
.cont .title { font-weight: 600; font-size: 17px; }
.play-circle { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); color: var(--tint); display: flex; align-items: center; justify-content: center; }
.play-circle svg.i { width: 16px; height: 16px; fill: currentColor; stroke: none; margin-left: 2px; }
.bar { height: 4px; background: var(--fill2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.bar > div { height: 100%; background: var(--tint); border-radius: 4px; }

/* ---------- Монети ---------- */
.balance { text-align: center; padding: 26px 16px 22px; color: #fff; border-radius: 22px;
  background: radial-gradient(120% 120% at 0% 0%, #ffb340, #ff6a00 55%, #c2410c); box-shadow: 0 12px 30px rgba(255,120,0,.25); }
.balance .num { font-size: 56px; font-weight: 800; letter-spacing: -.03em; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.balance .num svg.coin { width: 44px; height: 44px; margin-right: 8px; }
.balance .small { opacity: .85; }
.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pack { text-align: center; cursor: pointer; padding: 18px 12px 14px; transition: transform .15s; }
.pack:active { transform: scale(.97); }
.pack .c { font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; letter-spacing: -.02em; }
.pack .c svg.coin { color: var(--coin); }
.pack .bonus { font-size: 13px; color: var(--green); font-weight: 600; min-height: 18px; margin-top: 2px; }
.pack .price { display: inline-flex; margin-top: 10px; padding: 6px 16px; border-radius: 999px; background: var(--fill); color: var(--tint); font-weight: 600; font-size: 15px; }
.rules { margin: 0; padding: 0 16px; list-style: none; }
.rules li { padding: 11px 0; font-size: 15px; position: relative; padding-left: 26px; }
.rules li::before { content: ""; position: absolute; left: 2px; top: 50%; width: 14px; height: 7px; border-left: 2px solid var(--green);
  border-bottom: 2px solid var(--green); transform: translateY(-70%) rotate(-45deg); }
.rules li + li { border-top: .5px solid var(--sep); }
svg.coin.c-orange { color: var(--coin); }

/* ---------- Профіль ---------- */
.avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(180deg, #a1a1aa, #71717a); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; flex: none; }
.sub-card { color: #fff; border-radius: 22px; padding: 20px; background: linear-gradient(135deg, #1a1a1a, #3a3a3c); position: relative; overflow: hidden; }
.sub-card::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(10,132,255,.55), transparent 70%); }
.sub-card > * { position: relative; z-index: 1; }
.sub-card .rules li { border-color: rgba(255,255,255,.12); color: rgba(255,255,255,.9); padding-left: 26px; }
.sub-card .rules { padding: 0; margin: 8px 0 14px; }

/* ---------- Сторінка серіалу ---------- */
.hero { margin: 0 -16px; padding: 100px 20px 24px; position: relative; color: #fff; min-height: 420px; display: flex;
  flex-direction: column; justify-content: flex-end; text-align: center; align-items: center; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15), transparent 30%, transparent 50%, var(--bg)); }
.hero > * { position: relative; z-index: 1; }
.hero .emoji { font-size: 96px; filter: drop-shadow(0 16px 30px rgba(0,0,0,.3)); margin-bottom: auto; padding-top: 20px; }
.hero h1 { margin: 16px 0 4px; font-size: 30px; font-weight: 800; color: var(--label); }
.hero .small { color: var(--label2); }
.detail-actions { display: flex; gap: 10px; margin-top: 4px; }
.detail-desc { font-size: 15px; line-height: 1.45; margin: 16px 0 10px; }
.ep-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.ep { aspect-ratio: 1; border-radius: 12px; background: var(--bg-elev); display: flex;
  align-items: center; justify-content: center; font-weight: 600; font-size: 15px; position: relative; font-variant-numeric: tabular-nums; }
.ep.watched { background: var(--tint); color: #fff; }
.ep.locked { color: var(--label3); }
.ep.locked .lk { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; color: var(--label2); }
.back { position: absolute; top: max(14px, var(--st, env(safe-area-inset-top))); left: 16px; width: 36px; height: 36px; border-radius: 50%; z-index: 3;
  background: rgba(0,0,0,.28); color: #fff; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.back svg.i { width: 20px; height: 20px; stroke-width: 2.4; }

/* ---------- Плеєр ---------- */
.player { position: absolute; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; color: #fff;
  animation: up .35s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(100%); } }
.stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 22%, transparent 65%, rgba(0,0,0,.7)); pointer-events: none; }
.stage .scene { text-align: center; padding: 0 72px; z-index: 1; }
.stage .scene .e { font-size: 110px; animation: float2 5s ease-in-out infinite; display: inline-block; filter: drop-shadow(0 20px 40px rgba(0,0,0,.35)); }
@keyframes float2 { 50% { transform: translateY(-12px); } }
.stage .scene .line { font-size: 19px; font-weight: 600; margin-top: 22px; line-height: 1.3; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
.stage .paused { position: absolute; z-index: 2; width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,.35);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; }
.stage .paused svg.i { width: 32px; height: 32px; fill: #fff; stroke: none; margin-left: 4px; }
.stage .p-top { position: absolute; top: 0; left: 0; right: 0; padding: 14px 16px; padding-top: max(14px, var(--st, env(safe-area-inset-top)));
  display: flex; align-items: center; gap: 12px; z-index: 3; }
.stage .p-top .t { flex: 1; font-weight: 600; font-size: 17px; }
.stage .p-top .t .small { color: rgba(255,255,255,.7); font-weight: 400; }
.p-close { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.p-close svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
.p-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px max(20px, var(--sb, env(safe-area-inset-bottom))); z-index: 3; }
.p-progress { height: 4px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; margin-top: 10px; }
.p-progress > div { height: 100%; background: #fff; width: 0; border-radius: 4px; }
.p-side { position: absolute; right: 12px; bottom: 80px; display: flex; flex-direction: column; gap: 18px; z-index: 3; }
.subs { font-size: 13px; color: rgba(255,255,255,.7); }

/* Замкнена серія — аркуш із матеріалом */
.lock-screen { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.45); backdrop-filter: blur(30px) saturate(150%);
  -webkit-backdrop-filter: blur(30px) saturate(150%); display: flex; flex-direction: column; justify-content: center;
  padding: 28px 24px; gap: 10px; text-align: center; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }

window.MERI_BUILD = "2026-11-19-0511-7ba9add";

const CREATOR_TYPES = { originals: "Meri Originals", studio: "Студія", indie: "Незалежний автор", ai: "AI-студія" };

/* 05-recommend.js — Рекомендації для стрічки «Для тебе» */

// ---------- Рекомендації ----------
function recommend() {
  const genreW = {}, watchedIds = new Set(S.history.map(h => h.id));
  S.history.forEach(h => { const s = byId(h.id); if (s) genreW[s.genre] = (genreW[s.genre] || 0) + 1; });
  [...S.saved, ...S.liked].forEach(id => { const s = byId(id); if (s) genreW[s.genre] = (genreW[s.genre] || 0) + 2; });
  const lastSeenByGenre = {};
  [...S.history].reverse().forEach(h => { const s = byId(h.id); if (s && !lastSeenByGenre[s.genre]) lastSeenByGenre[s.genre] = s; });

  return SERIES.map(s => {
    const g = genreW[s.genre] || 0;
    const p = S.progress[s.id];
    const finished = p && p.watched.length >= s.episodes;
    let score = g * 3 + (s.rating || 0) * 2 + Math.log10(s.views + 1) + (s.isNew ? 1.5 : 0) - (finished ? 20 : 0);
    if (watchedIds.has(s.id) && !finished) score += 4; // продовжити
    const followed = S.following.includes(s.creatorId);
    if (followed && !finished) score += 3;             // автор, за яким стежиш
    let why;
    if (p && !finished) why = `Продовжити з ${p.ep}-ї серії`;
    else if (followed) why = `Від @${creatorOf(s).handle}, за яким ви стежите`;
    else if (g && lastSeenByGenre[s.genre] && lastSeenByGenre[s.genre].id !== s.id) why = `Бо вам сподобався «${lastSeenByGenre[s.genre].title}»`;
    else if (s.isNew) why = "Новинка тижня";
    else if (s.views > 2e6) why = "Популярне в Україні";
    else why = `${s.genre} · ${ratingText(s)}`;
    return { s, score, why };
  }).sort((a, b) => b.score - a.score);
}

    UI.stack.push({ detail: UI.detail, creator: UI.creator, creatorTab: UI.creatorTab, page: UI.page });
}
function openDetail(id) { pushScreen(); UI.detail = id; UI.creator = null; UI.page = null; render(); $("#view").scrollTop = 0; }
function openCreator(id, tab = "series") {
  if (!creatorById(id)) return;
  pushScreen(); UI.creator = id; UI.detail = null; UI.page = null; UI.creatorTab = tab;

  pushScreen(); UI.page = page; UI.detail = UI.creator = null; render(); $("#view").scrollTop = 0;
}

  const prev = UI.stack.pop() || { detail: null, creator: null, creatorTab: "series", page: null };

  const v = $("#view"), app = $("#app");

  app.classList.toggle("detail", !!(UI.detail || UI.creator || UI.page || UI.tab === "profile"));
  v.classList.toggle("feed-mode", feed);
  $("#pageTitle").innerHTML = feed ? `<span class="logo">Meri<span>.ua</span></span>` : TITLES[UI.tab];
  if (UI.page) return ({ settings: renderSettings, "edit-me": renderEditMe, submit: renderSubmit })[UI.page](v);

}

function watchAd(onDone) {
  const a = adStatus();
  if (a.left <= 0) return toast("Денний ліміт реклами вичерпано");
  if (a.wait) return toast(`Наступна реклама через ${a.wait} с`);
  const ad = ADS[(S.ads.count + hash(today())) % ADS.length];
  let t = CFG.AD_SECONDS;
  const m = $("#modal");
  m.innerHTML = `<div class="sheet">
    <div class="ad-frame" style="background:linear-gradient(160deg, ${ad.color}, #111)">
      <span class="tag">Реклама</span><span class="timer" id="adT">${t}</span>
      <div class="e">${ad.emoji}</div><div class="brand">${esc(ad.brand)}</div>

    </div>
    <button class="btn block" id="adDone" style="margin-top:14px" disabled>Зачекайте ${t} с</button>
  </div>`;
  m.classList.remove("hidden");
  const iv = setInterval(() => {
    t--; $("#adT").textContent = Math.max(t, 0);
    const b = $("#adDone");

    clearInterval(iv);

      closeModal(); toast(`+${CFG.AD_REWARD} монет · ${S.ads.count}/${CFG.AD_LIMIT} сьогодні`);
      onDone && onDone();
    };
  }, 1000);
}
function closeModal() { const m = $("#modal"); m.classList.add("hidden"); m.innerHTML = ""; }

// ---------- Сторінка серіалу ----------
function voteHTML(s) {
  const mine = S.votes[s.id];
  const base = s.vote.options.map((_, i) => 200 + (hash(s.id + i) % 900));
  if (mine !== undefined) base[mine] += S.sub ? 2 : 1;
  const total = base.reduce((a, b) => a + b, 0);
  return `<div class="card" style="margin-top:12px">
    <b style="font-size:17px">${esc(s.vote.q)}</b><div class="muted small" style="margin-top:2px">Глядачі впливають на продовження історії</div>
    ${s.vote.options.map((o, i) => {
      const pct = Math.round(base[i] / total * 100);
      return `<button class="vote-opt ${mine === i ? "mine" : ""}" data-vote="${s.id}" data-i="${i}">
        ${mine !== undefined ? `<div class="fill" style="transform:scaleX(${pct / 100})"></div>` : ""}
        <span><span>${esc(o)}</span>${mine !== undefined ? `<b>${pct}%</b>` : ""}</span></button>`;
    }).join("")}
  </div>`;
}

  render();
}

// Посилання на сторінку автора: https://…/?creator=teplahata
async function shareCreator(id) {
  const c = creatorById(id); if (!c) return;
  const url = `${location.origin}${location.pathname}?creator=${encodeURIComponent(id)}`;
  try {
    if (navigator.share) { await navigator.share({ title: c.name, text: `${c.name} на Meri`, url }); return; }
    await navigator.clipboard.writeText(url);
    toast("Посилання скопійовано");
  } catch (e) {
    if (e && e.name === "AbortError") return; // людина сама закрила меню «Поділитися»
    toast(url);
  }
}

/* 17-me.js — Ваш профіль у стилі TikTok, «Редагувати профіль» і ваші серіали в каталозі */

// ---------- Мій профіль ----------
// Кольори аватара й обкладинок (пари для градієнта) і символи на вибір.
const PALETTE = [["#5e5ce6", "#0a84ff"], ["#134e5e", "#71b280"], ["#cb2d3e", "#ef473a"],
  ["#f7971e", "#ffd200"], ["#232526", "#414345"], ["#ee9ca7", "#ffdde1"], ["#8e2de2", "#4a00e0"]];
const ME_EMOJI = ["🎬", "✍️", "🎭", "🎥", "🌻", "🦋", "🐺", "⭐"];

const meName = () => S.me.name.trim() || "Гість";
const meHandle = () => S.me.handle || "guest";
const meColors = () => PALETTE[S.me.color] || PALETTE[0];
function meAvatarHTML(size = "md", ring = false) {
  const c = { id: "me", emoji: S.me.emoji || "🎬", colors: meColors() };
  return avatarHTML(c, size, ring ? "live" : false);
}

// Шапка підсторінки: «назад», заголовок по центру, необов'язкова кнопка праворуч.
function pageBarHTML(title, right = "") {
  return `<div class="ig-bar page-bar">
    <button class="ig-back" data-back aria-label="Назад">${ICONS.back}</button>
    <b class="pb-title">${title}</b><span class="pb-right">${right}</span>
  </div>`;
}

// Опубліковані вами серіали стають частиною каталогу: автор «me» і його серіали
// додаються в CREATORS і SERIES. Викликати після будь-якої зміни профілю чи подач.
function syncMine() {
  for (let i = SERIES.length - 1; i >= 0; i--) if (SERIES[i].creatorId === "me") SERIES.splice(i, 1);
  const ci = CREATORS.findIndex(c => c.id === "me"); if (ci >= 0) CREATORS.splice(ci, 1);
  const pub = S.submissions.filter(d => d.status === "published");
  if (!pub.length) return;
  CREATORS.push({ id: "me", name: meName(), handle: meHandle(), type: "indie", city: S.me.city.trim() || "Україна",
    since: new Date().getFullYear(), verified: false, followers: 0, emoji: S.me.emoji || "🎬", colors: meColors(),
    bio: S.me.bio.trim() || "Автор на Meri." });
  pub.forEach(d => SERIES.push(seriesFromSubmission(d)));
}
function seriesFromSubmission(d) {
  return {
    id: d.id, title: d.title, genre: d.genre, tags: [d.genre, "Від автора"], desc: d.desc,
    episodes: d.episodes, freeEps: d.freeEps, rating: null, views: 0, isNew: true, creatorId: "me",
    colors: PALETTE[d.color] || PALETTE[0], emoji: d.cover ? "" : d.emoji, cover: d.cover || "",
    beats: [d.desc.split(/(?<=[.!?…])\s/)[0].slice(0, 90), `Серія від @${meHandle()}`],
    vote: { q: "Що має статися далі?", options: ["Продовження історії", "Новий сезон", "Спін-оф про героя"] }
  };
}

// ---------- Екран профілю ----------
const SUB_STATUS = { draft: ["Чернетка", "draft"], review: ["На модерації", "mod"], published: ["Опубліковано", "ok"] };

function renderProfile(v) {
  const t = UI.meTab;
  const mine = [...S.submissions].sort((a, b) => b.createdAt - a.createdAt);
  const cellFor = s => `<button class="ig-cell" data-open="${s.id}" style="background:${grad(s)}" aria-label="${esc(s.title)}">
      <span class="em">${s.emoji}</span><span class="v">${ICONS.play} ${fmtViews(s.views)}</span></button>`;
  const seriesGrid = (ids, emptyIcon, emptyText) => {
    const list = ids.map(byId).filter(Boolean);
    return list.length ? `<div class="ig-grid">${list.map(cellFor).join("")}</div>`
      : `<div class="empty"><div class="e">${ICONS[emptyIcon]}</div>${emptyText}</div>`;
  };

  let body;
  if (t === "liked") body = seriesGrid(S.liked, "heart", "Серіали, яким ви поставили ♥, з'являться тут.");

const SUB_EMOJI = ["🎬", "🌲", "🏔", "💔", "🕵️", "🔥", "🌊", "🐺", "✨", "🏙", "👑", "🚀"];
const VOICES = { ua: "Українська озвучка", ai: "AI-озвучка", subs: "Оригінал + субтитри" };

const draft = () => S.submissions.find(d => d.id === UI.draftId);

// Перевірка кроку: порожній рядок — усе гаразд, інакше — що виправити.
function stepError(d, step) {
  if (step === 1) {
    if (d.title.trim().length < 2) return "Дайте серіалу назву — щонайменше 2 символи.";
    if (!d.genre) return "Оберіть жанр.";
    if (d.desc.trim().length < 20) return "Опишіть історію — хоча б одне речення (20+ символів).";
  }
  if (step === 3) {
    if (!(d.episodes >= 3 && d.episodes <= 100)) return "Кількість серій — від 3 до 100.";
    if (!(d.minutes >= 1 && d.minutes <= 5)) return "Тривалість серії — від 1 до 5 хвилин.";
    if (!(d.freeEps >= 1 && d.freeEps <= d.episodes)) return "Безкоштовних серій — від 1 до загальної кількості.";
  }
  if (step === 4 && !(d.agreeOriginal && d.agreeRules)) return "Підтвердьте обидва пункти, щоб надіслати.";
  return "";
}

// Зменшує фото до 360×640 (обрізає по центру, як «cover») і повертає JPEG data-URL ~30–60 КБ,
// щоб постер вміщався у сховище браузера.
function downscaleImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const W = 360, H = 640, k = Math.max(W / img.width, H / img.height);
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      c.getContext("2d").drawImage(img, (W - img.width * k) / 2, (H - img.height * k) / 2, img.width * k, img.height * k);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

// Поля майстра пишуться в чернетку одразу, без перемальовування (щоб не губився курсор).
function onSubmitField(e) {
  const k = e.target.dataset && e.target.dataset.sfield; const d = k && draft();
  if (!d) return;
  if (e.target.type === "checkbox") d[k] = e.target.checked;
  else if (e.target.type === "number") d[k] = Math.round(+e.target.value) || 0;
  else d[k] = e.target.value;
  if (k === "desc" && $("#descN")) $("#descN").textContent = d.desc.length;
  const err = $("#sErr"); if (err) err.textContent = "";
  save();
}
document.addEventListener("input", onSubmitField);
document.addEventListener("change", e => { if (e.target.type === "checkbox") onSubmitField(e); });

const pickDraft = (k, val) => { const d = draft(); if (!d) return; d[k] = val; save(); render(); };

ACTIONS["s-voice"] = el => pickDraft("voice", el.dataset.v);

ACTIONS["s-close"] = () => { toast("Чернетку збережено в «Моїх серіалах»"); UI.meTab = "mine"; goBack(); };
ACTIONS["s-delete"] = () => {
  const d = draft(); if (!d || !confirm("Видалити чернетку? Її не можна буде повернути.")) return;

};
ACTIONS["s-next"] = () => {
  const d = draft(); if (!d) return;

  if (err) { $("#sErr").textContent = err; return; }
  if (d.step < 4) { d.step++; save(); render(); $("#view").scrollTop = 0; return; }
  d.title = d.title.trim(); d.desc = d.desc.trim();
  d.status = "review"; d.submittedAt = Date.now(); save();
  toast("Серіал надіслано на модерацію");
  UI.meTab = "mine"; goBack(); scheduleModeration();
};

// ---------- Модерація (демо) ----------
// Заявка «на модерації» стає опублікованою через CFG.MODERATION_SECONDS — навіть якщо
// застосунок закрили: при наступному запуску перевірка спрацює одразу.
function checkModeration() {
  const now = Date.now(), done = [];
  S.submissions.forEach(d => {
    if (d.status === "review" && now >= d.submittedAt + CFG.MODERATION_SECONDS * 1000) {
      d.status = "published"; d.publishedAt = now; done.push(d);
    }
  });
  if (done.length) {
    save(); syncMine();
    toast(done.length === 1 ? `«${done[0].title}» опубліковано в Каталозі` : `Опубліковано серіалів: ${done.length}`);
    if (UI.tab === "profile" || UI.tab === "catalog") render();
  }
  scheduleModeration();
}
function scheduleModeration() {
  clearTimeout(scheduleModeration._t);
  const next = S.submissions.filter(d => d.status === "review").map(d => d.submittedAt + CFG.MODERATION_SECONDS * 1000);
  if (next.length) scheduleModeration._t = setTimeout(checkModeration, Math.max(250, Math.min(...next) - Date.now()));
}

/* 20-player.js — Плеєр: серії, замок, фінал, свайпи */

// ---------- Плеєр ----------
const P = { s: null, ep: 1, t: 0, playing: false, iv: null };

function openPlayer(id, ep = 1) {
  P.s = byId(id); P.ep = Math.min(Math.max(1, +ep), P.s.episodes);
  $("#player").classList.remove("hidden");
  startEpisode();
}
function closePlayer() {
  clearInterval(P.iv); P.playing = false;
  $("#player").classList.add("hidden"); $("#player").innerHTML = "";
  render();
}

function startEpisode() {
  clearInterval(P.iv); P.t = 0;
  const s = P.s, ep = P.ep;
  renderPlayer();
  if (!isUnlocked(s, ep)) return showLock();
  const pr = S.progress[s.id] || { ep, watched: [], ts: 0 };
  pr.ep = ep; pr.ts = Date.now(); S.progress[s.id] = pr;
  S.history = S.history.filter(h => !(h.id === s.id && h.ep === ep)).concat({ id: s.id, ep, ts: Date.now() }).slice(-50);
  save();
  play();
}

function renderPlayer() {
  const s = P.s, ep = P.ep;
  const line = s.beats[(ep - 1) % s.beats.length];
  $("#player").innerHTML = `
    <div class="stage" id="stage" style="background:${grad(s)}">
      <div class="p-top">
        <button class="p-close" id="pClose" aria-label="Закрити">${ICONS.close}</button>
        <div class="t">${esc(s.title)}<div class="small">Серія ${ep} з ${s.episodes}</div></div>
      </div>
      <div class="scene"><span class="e">${s.emoji}</span>${S.settings.subs ? `<div class="line">${esc(line)}</div>` : ""}</div>
      <div class="paused hidden" id="pPaused">${ICONS.play}</div>
      <div class="p-side">
        <button class="side-btn ${S.liked.includes(s.id) ? "on" : ""}" data-like="${s.id}"><b>${ICONS.heart}</b>Лайк</button>
        <button class="side-btn save ${S.saved.includes(s.id) ? "on" : ""}" data-save="${s.id}"><b>${ICONS.bookmark}</b>Зберегти</button>
        <button class="side-btn" id="pList"><b>${ICONS.list}</b>Серії</button>
        <button class="side-btn" id="pNext"><b>${ICONS.next}</b>Далі</button>
      </div>
      <div class="p-bottom">
        <div class="subs">Українська озвучка · свайп угору — наступна серія</div>
        <div class="p-progress"><div id="pBar"></div></div>
      </div>
    </div>`;
  $("#pClose").onclick = e => { e.stopPropagation(); closePlayer(); };
  $("#pNext").onclick = e => { e.stopPropagation(); nextEp(); };
  $("#pList").onclick = e => { e.stopPropagation(); const id = s.id; closePlayer(); openDetail(id); };
  $("#stage").onclick = e => { if (!e.target.closest("button") && !$(".lock-screen")) togglePlay(); };
}

function play() {
  P.playing = true; $("#pPaused") && $("#pPaused").classList.add("hidden");
  clearInterval(P.iv);
  P.iv = setInterval(() => {
    P.t += 0.1;
    const bar = $("#pBar"); if (bar) bar.style.width = Math.min(100, P.t / CFG.EP_SECONDS * 100) + "%";
    if (P.t >= CFG.EP_SECONDS) endEpisode();
  }, 100);
}
function togglePlay() {
  if (P.playing) { P.playing = false; clearInterval(P.iv); $("#pPaused").classList.remove("hidden"); }
  else play();
}
function endEpisode() {
  clearInterval(P.iv); P.playing = false;
  const s = P.s, pr = S.progress[s.id];
  if (!pr.watched.includes(P.ep)) pr.watched.push(P.ep);
  if (P.ep < s.episodes) pr.ep = P.ep + 1;
  save();
  if (P.ep >= s.episodes) return showFinale();
  if (S.settings.autoplay) nextEp();
  else { $("#pPaused").classList.remove("hidden"); toast("Серію завершено"); }
}
function nextEp() {
  if (P.ep >= P.s.episodes) return showFinale();
  P.ep++; startEpisode();
}
function prevEp() { if (P.ep > 1) { P.ep--; startEpisode(); } }

function overlay(html) {
  const o = document.createElement("div"); o.className = "lock-screen"; o.innerHTML = html;
  $("#stage").appendChild(o); return o;
}

function showLock() {
  const s = P.s, ep = P.ep, a = adStatus();
  const enough = S.coins >= CFG.EP_COST;
  const o = overlay(`
    <div class="big">${ICONS.lock}</div>
    <h2 style="margin:0">Серія ${ep}</h2>
    <p>Відкрийте за ${CFG.EP_COST} монет · у вас ${COIN}${S.coins}</p>
    <button class="btn white" id="lkUnlock" ${enough ? "" : "disabled"}>Відкрити за ${COIN}${CFG.EP_COST}</button>
    <button class="btn" id="lkAd" ${a.can ? "" : "disabled"}>${a.left <= 0 ? "Ліміт реклами на сьогодні" : a.wait ? `Реклама через ${a.wait} с` : `Реклама · +${CFG.AD_REWARD} монет`}</button>
    <button class="btn secondary" id="lkSub">Усі серії з Meri+</button>
    ${ep > 1 ? `<button class="btn plain" id="lkPrev">Попередня серія</button>` : ""}
  `);
  $("#lkUnlock", o).onclick = () => {
    S.coins -= CFG.EP_COST; S.unlocked[s.id] = [...(S.unlocked[s.id] || []), ep]; save();
    toast(`Серію ${ep} відкрито`); startEpisode();
  };
  $("#lkAd", o).onclick = () => watchAd(() => { o.remove(); showLock(); });
  $("#lkSub", o).onclick = () => { closePlayer(); go("profile"); };
  const pv = $("#lkPrev", o); if (pv) pv.onclick = prevEp;
  if (!a.can && a.left > 0) setTimeout(() => { if (o.isConnected) { o.remove(); showLock(); } }, 1000);
}

function showFinale() {
  const s = P.s;
  const o = overlay(`<div class="big">${ICONS.vote}</div><h2 style="margin:0">Сезон завершено</h2>
    <p>Ваш голос вплине на продовження «${esc(s.title)}»</p>
    <div id="fVote" style="text-align:left"></div>
    <button class="btn plain" id="fClose">До каталогу</button>`);
  const paint = () => { $("#fVote", o).innerHTML = voteHTML(s); };
  paint();
  o.addEventListener("click", e => { const b = e.target.closest("[data-vote]"); if (b) { e.stopPropagation(); castVote(b); paint(); } });
  $("#fClose", o).onclick = () => { closePlayer(); go("catalog"); };
}

function castVote(b) {
  S.votes[b.dataset.vote] = +b.dataset.i; save(); toast("Ваш голос враховано");
}

// Свайпи та клавіатура в плеєрі
let touchY = null;
$("#player").addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
$("#player").addEventListener("touchend", e => {
  if (touchY === null) return;
  const dy = e.changedTouches[0].clientY - touchY; touchY = null;
  if (Math.abs(dy) < 60) return;
  dy < 0 ? nextEp() : prevEp();
});
let wheelLock = 0;
$("#player").addEventListener("wheel", e => {
  if (Date.now() < wheelLock || Math.abs(e.deltaY) < 30 || $(".lock-screen")) return;
  wheelLock = Date.now() + 700; e.deltaY > 0 ? nextEp() : prevEp();
}, { passive: true });
document.addEventListener("keydown", e => {
  if ($("#player").classList.contains("hidden")) return;
  if (e.key === "Escape") closePlayer();
  else if (e.key === "ArrowDown") nextEp();
  else if (e.key === "ArrowUp") prevEp();
  else if (e.key === " " && !$(".lock-screen")) { e.preventDefault(); togglePlay(); }
});


/* 30-events.js — Один обробник кліків на весь застосунок */

// ---------- Делегування кліків ----------
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tab],[data-go],[data-open],[data-play],[data-like],[data-save],[data-genre],[data-pack],[data-setting],[data-vote],[data-back],[data-close],[data-design],[data-follow],[data-creator],[data-ctab],[data-share-creator],[data-act],[data-page]");
  if (!el) { if (e.target.id === "modal") closeModal(); return; }
  const d = el.dataset;
  if (d.act) { if (ACTIONS[d.act]) ACTIONS[d.act](el, e); }
  else if (d.page) openPage(d.page);
  else if (d.tab) go(d.tab);
  else if (d.go) go(d.go);
  else if (d.play) { closeModal(); openPlayer(d.play, d.ep); }
  else if (d.open) { if (!$("#player").classList.contains("hidden")) closePlayer(); openDetail(d.open); }
  else if (d.like) { S.liked = toggleIn(S.liked, d.like); save(); el.classList.toggle("on"); }
  else if (d.save) {
    S.saved = toggleIn(S.saved, d.save); save();
    toast(S.saved.includes(d.save) ? "Збережено в медіатеку" : "Прибрано з медіатеки");
    if (el.classList.contains("side-btn")) el.classList.toggle("on"); else render();
  }
  else if (d.genre) { if (UI.tab !== "catalog") { UI.tab = "catalog"; renderTabbar(); } UI.genre = d.genre; render(); }
  else if (d.pack) buyPack(+d.pack);
  else if (d.setting) { S.settings[d.setting] = !S.settings[d.setting]; save(); el.classList.toggle("on"); }
  // Не data-variant: цей атрибут має сам #app, і тоді будь-який клік «перемикав дизайн».
  else if (d.design) { S.design = d.design; save(); applyVariant(); render(); }
  else if (d.vote !== undefined && !el.closest(".lock-screen")) { castVote(el); render(); }
  else if (d.follow) toggleFollow(d.follow);
  else if (d.shareCreator) shareCreator(d.shareCreator);
  else if (d.ctab) { UI.creatorTab = d.ctab; render(); }
  else if (d.creator) { if (!$("#player").classList.contains("hidden")) closePlayer(); openCreator(d.creator); }
  else if ("back" in d) goBack();
  else if ("close" in d) closeModal();
});


/* 99-start.js — Старт: усе готово — малюємо перший екран */

// ---------- Старт ----------
if (EMBED) { document.documentElement.style.setProperty("--st", "54px"); document.documentElement.style.setProperty("--sb", "22px"); }
$("#coinIco").innerHTML = COIN;
applyVariant();
syncMine();          // ваші опубліковані серіали — у каталог
checkModeration();   // заявки, чия «модерація» минула, поки застосунок був закритий
resetAdsIfNewDay();
updateCoins();
renderTabbar();
if (params.get("open")) UI.detail = params.get("open");
if (params.get("creator") && creatorById(params.get("creator"))) { UI.creator = params.get("creator"); if (!S.seenCreators.includes(UI.creator)) { S.seenCreators.push(UI.creator); save(); } }
render();


  </script>
